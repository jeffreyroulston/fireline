[package]
name = "ga-fire-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optimized FiZa max-damage and deck-ratio simulation engine"

[lib]
crate-type = ["rlib"]

[dependencies]
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
thiserror = "2"
tracing = "0.1"
ts-rs = { version = "10", optional = true, features = ["serde-compat"] }

[dev-dependencies]
criterion = "0.7"

[features]
default = []
ts = ["dep:ts-rs"]

[[bench]]
name = "solver"
harness = false

[lints]
workspace = true
