[workspace]
members = ["crates/engine", "crates/cli", "crates/worker"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

# CI denies all warnings; keep the perf group and this nursery lint audible
# in local builds so issues surface before CI does.
[workspace.lints.rust]
future-incompatible = { level = "warn", priority = 1 }
nonstandard_style = { level = "deny", priority = 2 }

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
perf = { level = "deny", priority = 9 }
pedantic = { level = "warn", priority = 3 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
