# Default stack pulls published images from GHCR (see scripts/update.*).
# Local rebuild from source: docker compose up --build
# (build: + image: means --build tags the result as the GHCR image name.)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fireline
      POSTGRES_PASSWORD: fireline
      POSTGRES_DB: fireline
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fireline -d fireline"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    image: ghcr.io/jeffreyroulston/fireline-worker:${FIRELINE_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  api:
    image: ghcr.io/jeffreyroulston/fireline-api:${FIRELINE_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgres://fireline:fireline@postgres:5432/fireline
      WORKER_URL: http://worker:8081
      API_PORT: 8080
      API_CONCURRENCY: ${API_CONCURRENCY:-1}
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  web:
    image: ghcr.io/jeffreyroulston/fireline-web:${FIRELINE_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    ports:
      - "${FIRELINE_PORT:-80}:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  pgdata:
